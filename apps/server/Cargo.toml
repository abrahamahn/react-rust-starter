[package]
name = "starter-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "starter-server"
path = "src/bin/api.rs"

[dependencies]
argon2 = "=0.5.3"
axum = "0.8.9"
deadpool-postgres = "0.14.2"
getrandom = "0.4.3"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-postgres = "0.7.18"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
